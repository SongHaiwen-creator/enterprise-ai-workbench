name: enterprise-ai-workbench

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_local}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_workbench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init/001-create-test-database.sql:/docker-entrypoint-initdb.d/001-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
